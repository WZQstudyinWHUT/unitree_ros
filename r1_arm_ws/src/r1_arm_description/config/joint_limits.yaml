# 关节级安全限值（供 MoveIt2 / ros2_control 使用）。
#
# 注意：URDF 中的 velocity 限值（18.7 / 33.4 / 37.7 rad/s ≈ 1072–2160°/s）
# 疑似电机侧规格参数，而非关节级安全限值；官方整机规格为 >180°/s。
# 此处统一采用保守值 180°/s = 3.14 rad/s，待官方 SDK/文档确认后更新。
# effort 保持官方值。
joint_limits:
  J1:
    has_velocity_limits: true
    max_velocity: 3.14
    has_acceleration_limits: true
    max_acceleration: 10.0
    has_effort_limits: true
    max_effort: 60.0
  J2:
    has_velocity_limits: true
    max_velocity: 3.14
    has_acceleration_limits: true
    max_acceleration: 10.0
    has_effort_limits: true
    max_effort: 60.0
  J3:
    has_velocity_limits: true
    max_velocity: 3.14
    has_acceleration_limits: true
    max_acceleration: 10.0
    has_effort_limits: true
    max_effort: 33.0
  J4:
    has_velocity_limits: true
    max_velocity: 3.14
    has_acceleration_limits: true
    max_acceleration: 10.0
    has_effort_limits: true
    max_effort: 33.0
  J5:
    has_velocity_limits: true
    max_velocity: 3.14
    has_acceleration_limits: true
    max_acceleration: 10.0
    has_effort_limits: true
    max_effort: 33.0
  J6:
    has_velocity_limits: true
    max_velocity: 3.14
    has_acceleration_limits: true
    max_acceleration: 10.0
    has_effort_limits: true
    max_effort: 10.0
  J7:
    has_velocity_limits: true
    max_velocity: 3.14
    has_acceleration_limits: true
    max_acceleration: 10.0
    has_effort_limits: true
    max_effort: 10.0
